name: Windows test build (Blackmagic RAW)

# Builds a portable, unsigned Windows x64 FilmCraft with Blackmagic RAW support for hands-on
# testing: filmcraft.exe, filmcraft-cli.exe and "Check Blackmagic RAW.bat", uploaded as the
# artifact "FilmCraft-BRAW-windows-x64". Runs the Blackmagic RAW tests on Windows first.

on:
  push:
    branches: [braw-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: braw-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  FILMCRAFT_BUILD_SHA: ${{ github.sha }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: braw-windows-x64

      - name: Blackmagic RAW tests
        run: cargo test --release --locked -p filmcraft-platform -- braw

      - name: Clippy (platform crate)
        continue-on-error: true
        run: cargo clippy --release --locked -p filmcraft-platform --all-targets -- -D warnings

      - name: Build FilmCraft
        shell: pwsh
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p filmcraft -p filmcraft-cli --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test (no Blackmagic runtime on this machine; must report, not crash)
        shell: pwsh
        run: |
          $cli = 'target\x86_64-pc-windows-msvc\release\filmcraft-cli.exe'
          & $cli --version
          & $cli braw-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble the test folder
        shell: pwsh
        run: |
          $out = 'dist\FilmCraft-BRAW-windows-x64'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'target\x86_64-pc-windows-msvc\release\filmcraft.exe' $out
          Copy-Item 'target\x86_64-pc-windows-msvc\release\filmcraft-cli.exe' $out
          Copy-Item 'packaging\windows\braw-test\*' $out
          Copy-Item 'LICENSE-MIT','LICENSE-APACHE','NOTICE' $out
          Get-ChildItem $out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FilmCraft-BRAW-windows-x64
          path: dist/FilmCraft-BRAW-windows-x64
          if-no-files-found: error
          retention-days: 30
