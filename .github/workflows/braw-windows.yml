name: Windows test build (Blackmagic RAW)

# Builds a portable, unsigned Windows x64 FilmCraft with Blackmagic RAW support for hands-on
# testing: filmcraft.exe, filmcraft-cli.exe, "Check Blackmagic RAW.bat" and "Check Plug-ins.bat", uploaded as the
# artifact "FilmCraft-BRAW-windows-x64". Runs the Blackmagic RAW tests on Windows first.

on:
  push:
    branches: [braw-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: braw-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  FILMCRAFT_BUILD_SHA: ${{ github.sha }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: braw-windows-x64

      - name: Build OpenFX example plug-ins (test fixtures, BSD-3-Clause; not shipped)
        shell: pwsh
        run: |
          git clone --quiet https://github.com/AcademySoftwareFoundation/openfx.git ofx-src
          git -C ofx-src checkout --quiet adb790bf0043714cae6091d58791e8cdabdd9e12
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          New-Item -ItemType Directory -Force -Path ofx-test | Out-Null
          $lib = (Get-ChildItem ofx-src\Support\Library\*.cpp | ForEach-Object { '"' + $_.FullName + '"' }) -join ' '
          foreach ($p in 'Invert','Basic','Transition','Tester','ChoiceParams','Field') {
            $src = (Get-ChildItem "ofx-src\Support\Plugins\$p\*.cpp" | ForEach-Object { '"' + $_.FullName + '"' }) -join ' '
            cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cl /nologo /LD /O1 /EHsc /std:c++17 /w /Iofx-src\include /Iofx-src\Support\include /Iofx-src\Support\Plugins\include $lib $src /Feofx-test\S$p.ofx /link opengl32.lib >nul"
            if (!(Test-Path "ofx-test\S$p.ofx")) { Write-Error "building $p failed"; exit 1 }
          }
          Get-ChildItem ofx-test\*.ofx

      - name: Blackmagic RAW and OpenFX tests
        shell: pwsh
        run: |
          $env:FILMCRAFT_OFX_TEST_PLUGINS = (Resolve-Path ofx-test).Path
          cargo test --release --locked -p filmcraft-platform -- braw ofx --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clippy (platform crate)
        continue-on-error: true
        run: cargo clippy --release --locked -p filmcraft-platform --all-targets -- -D warnings

      - name: Build FilmCraft
        shell: pwsh
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p filmcraft -p filmcraft-cli --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test (no Blackmagic runtime on this machine; must report, not crash)
        shell: pwsh
        run: |
          $cli = 'target\x86_64-pc-windows-msvc\release\filmcraft-cli.exe'
          & $cli --version
          & $cli braw-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # OpenFX: the example plug-ins scanned in child processes, as on a user's machine
          $env:OFX_PLUGIN_PATH = (Resolve-Path ofx-test).Path + '\bundles'
          foreach ($f in Get-ChildItem ofx-test\*.ofx) {
            $d = "ofx-test\bundles\$($f.Name).bundle\Contents\Win64"
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            Copy-Item $f.FullName $d
          }
          & $cli plugins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble the test folder
        shell: pwsh
        run: |
          $out = 'dist\FilmCraft-BRAW-windows-x64'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'target\x86_64-pc-windows-msvc\release\filmcraft.exe' $out
          Copy-Item 'target\x86_64-pc-windows-msvc\release\filmcraft-cli.exe' $out
          Copy-Item 'packaging\windows\braw-test\*' $out
          Copy-Item 'LICENSE-MIT','LICENSE-APACHE','NOTICE' $out
          Get-ChildItem $out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FilmCraft-BRAW-windows-x64
          path: dist/FilmCraft-BRAW-windows-x64
          if-no-files-found: error
          retention-days: 30
